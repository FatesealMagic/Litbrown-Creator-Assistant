  directions:
  - LCA substitutes bits of text and data into a template that you provide in order to generate titles, descriptions, and other blurbs for each piece of content you release.
  - "To tell LCA to insert a variable into your template, use a dollar sign $ and curly braces {} like this:"
  - "<html><h3><pre>${variable_name}</pre></h3></html>"
  - "If you want to put a literal dollar sign in your template, you will have to double them like this:"
  - "<html><h3><pre>$$</pre></h3></html>"
  - "Select a variable to learn more:"

