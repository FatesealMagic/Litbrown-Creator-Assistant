<!DOCTYPE html>
<html><head><style>

	body {
		overflow: clip;
		margin: 0;
		border: 0;
		padding: 0;
		font-family: Verdana;
		color: white;
	}
	
	div#background {
		position: fixed;
		top: 0;
		left: 0;
		width: 100vw;
		height: 100vh;
		background: url('/ice.png');
	}
	
	div#filter {
		position: fixed;
		width: 100vw;
		height: 100vh;
		backdrop-filter: grayscale(1) brightness(0.6);
		background-color: oklch(0.55 0.09 30 / 1);
		mix-blend-mode: soft-light;
	}
	
	div#splash-text {
		position: fixed;
		top: 4vh;
		left: 0;
		width: 100vw;
		font-size: 72px;
		font-weight: bold;
		text-align: center;
	}
	
	img {
		position: fixed;
		width: calc(50vmin * 0.8);
		height: calc(70vmin * 0.8);
		top: 50vh;
		translate: -50% -50%;
	}
	
	img#left-card   { left: 20vw; }
	img#center-card { left: 50vw; }
	img#right-card  { left: 80vw; }

	div#_variant {
		position: fixed;
		top: 82vh;
		left: 0;
		width: 100vw;
		font-size: 72px;
		font-weight: bold;
		text-align: center;
	}

</style><script>

	function new_data_update (controls, series, variant, project) {
		document.getElementById('splash-text').innerText = controls.user['splash-text'];
		for (card of ['left-card', 'center-card', 'right-card'])
			document.getElementById(card).src = controls.user[card]?.image_uris?.png ||
				controls.user[card]?.card_faces[controls.user[card].lca_selected_face].image_uris['png'] ||
				'';
		document.getElementById('_variant').innerText = variant?.name || '';
		document.getElementById('filter').style.backgroundColor = `oklch(0.55 0.09 ${controls.user['hue'] || 0} / 1)`;
	}

</script></head><body>
	<div id='background'></div>
	<div id='filter'></div>
	<div id='splash-text'></div>
	<img id='left-card' />
	<img id='center-card' />
	<img id='right-card' />
	<div id='_variant' />
</body></html>
